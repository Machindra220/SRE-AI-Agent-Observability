<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRE AI Agent — Incident History</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3348;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --accent: #6366f1;
    --accent-glow: rgba(99,102,241,0.15);
    --critical: #ef4444;
    --critical-bg: rgba(239,68,68,0.12);
    --high: #f97316;
    --high-bg: rgba(249,115,22,0.12);
    --medium: #eab308;
    --medium-bg: rgba(234,179,8,0.12);
    --low: #22c55e;
    --low-bg: rgba(34,197,94,0.12);
    --info: #3b82f6;
    --info-bg: rgba(59,130,246,0.12);
    --radius: 10px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), #818cf8);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .header h1 { font-size: 16px; font-weight: 600; }
  .header-sub { font-size: 12px; color: var(--text-muted); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .live-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--low);
    box-shadow: 0 0 8px var(--low);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .last-refresh { font-size: 11px; color: var(--text-muted); }

  /* ── Config bar ── */
  .config-bar {
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .config-bar label { font-size: 12px; color: var(--text-muted); }
  .config-bar input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 6px 10px;
    font-size: 12px;
    width: 420px;
    outline: none;
  }
  .config-bar input:focus { border-color: var(--accent); }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 12px;
    cursor: pointer;
    font-weight: 500;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn-ghost {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--text); }

  /* ── Stats row ── */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    padding: 20px 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }
  .stat-label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 6px; }
  .stat-value { font-size: 24px; font-weight: 700; }
  .stat-value.critical { color: var(--critical); }
  .stat-value.high { color: var(--high); }
  .stat-value.resolved { color: var(--low); }
  .stat-value.total { color: var(--accent); }

  /* ── Filters ── */
  .filters {
    padding: 0 24px 16px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filter-label { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
  .filter-btn {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .filter-btn:hover, .filter-btn.active {
    border-color: var(--accent);
    color: var(--text);
    background: var(--accent-glow);
  }
  .search-input {
    margin-left: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 5px 10px;
    font-size: 12px;
    width: 200px;
    outline: none;
  }
  .search-input:focus { border-color: var(--accent); }

  /* ── Table ── */
  .table-wrap {
    padding: 0 24px 24px;
    overflow-x: auto;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 700px;
  }
  thead th {
    text-align: left;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
  }
  tbody tr:hover { background: var(--surface2); }
  tbody td {
    padding: 12px 12px;
    vertical-align: middle;
    font-size: 13px;
  }

  /* ── Severity badge ── */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .4px;
  }
  .badge.P1, .badge.critical { background: var(--critical-bg); color: var(--critical); border: 1px solid rgba(239,68,68,.25); }
  .badge.P2, .badge.high { background: var(--high-bg); color: var(--high); border: 1px solid rgba(249,115,22,.25); }
  .badge.P3, .badge.medium, .badge.warning { background: var(--medium-bg); color: var(--medium); border: 1px solid rgba(234,179,8,.25); }
  .badge.P4, .badge.low, .badge.info { background: var(--info-bg); color: var(--info); border: 1px solid rgba(59,130,246,.25); }

  /* ── Confidence bar ── */
  .conf-bar {
    display: flex; align-items: center; gap: 8px;
  }
  .conf-track {
    width: 60px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .conf-fill { height: 100%; border-radius: 2px; }
  .conf-text { font-size: 11px; color: var(--text-muted); }

  /* ── Incident ID ── */
  .inc-id {
    font-family: monospace;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-glow);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ── Expand row ── */
  .expand-row td {
    padding: 0;
  }
  .expand-content {
    background: var(--surface2);
    border-top: 1px solid var(--border);
    padding: 20px 24px;
    display: none;
  }
  .expand-content.open { display: block; }
  .expand-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .expand-section h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .expand-section p {
    font-size: 13px;
    line-height: 1.6;
    color: var(--text);
  }
  .rca-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-size: 13px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 300px;
    overflow-y: auto;
  }
  .expand-actions { display: flex; gap: 8px; margin-top: 12px; }

  /* ── Empty / loading / error states ── */
  .state-box {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-muted);
  }
  .state-box .icon { font-size: 40px; margin-bottom: 12px; }
  .state-box p { font-size: 14px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 700px;
    max-height: 80vh;
    overflow-y: auto;
    padding: 24px;
  }
  .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .modal-title { font-size: 16px; font-weight: 600; }
  .modal-close { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; line-height: 1; }
  .modal-close:hover { color: var(--text); }
  .modal-section { margin-bottom: 16px; }
  .modal-section h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--text-muted); margin-bottom: 8px; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-left">
    <div class="logo">🤖</div>
    <div>
      <div class="header h1" style="font-size:16px;font-weight:600">SRE AI Agent</div>
      <div class="header-sub">Incident Triage History</div>
    </div>
  </div>
  <div class="header-right">
    <div class="live-dot"></div>
    <div class="last-refresh" id="lastRefresh">Never refreshed</div>
    <button class="btn btn-ghost" onclick="loadIncidents()">↻ Refresh</button>
    <div style="position:relative">
      <button class="btn btn-ghost" onclick="toggleDownloadMenu()" id="dlBtn">⬇ Download</button>
      <div id="dlMenu" style="display:none;position:absolute;right:0;top:36px;background:var(--surface);border:1px solid var(--border);border-radius:8px;min-width:180px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4)">
        <div style="padding:6px 0">
          <button onclick="downloadJSON();toggleDownloadMenu()" style="width:100%;text-align:left;padding:9px 16px;background:none;border:none;color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">
            <span>{ }</span> All Incidents JSON
          </button>
          <button onclick="downloadCSV();toggleDownloadMenu()" style="width:100%;text-align:left;padding:9px 16px;background:none;border:none;color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">
            <span>⊞</span> All Incidents CSV
          </button>
          <div style="height:1px;background:var(--border);margin:4px 0"></div>
          <button onclick="downloadFilteredJSON();toggleDownloadMenu()" style="width:100%;text-align:left;padding:9px 16px;background:none;border:none;color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">
            <span>⚡</span> Filtered View JSON
          </button>
          <button onclick="downloadFilteredCSV();toggleDownloadMenu()" style="width:100%;text-align:left;padding:9px 16px;background:none;border:none;color:var(--text);cursor:pointer;font-size:13px;display:flex;align-items:center;gap:10px" onmouseover="this.style.background='var(--surface2)'" onmouseout="this.style.background='none'">
            <span>⚡</span> Filtered View CSV
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Config bar -->
<div class="config-bar">
  <label>Agent URL:</label>
  <input type="text" id="agentUrl"
    placeholder="http://<AGENT-LB>/agent/history"
    value="http://a01f7c54eb1974898bc4039be2e27d5a-592454479.us-east-1.elb.amazonaws.com/agent/history">
  <button class="btn" onclick="loadIncidents()">Connect</button>
  <label style="margin-left:12px">Auto-refresh:</label>
  <select id="refreshInterval" onchange="setAutoRefresh()"
    style="background:var(--surface);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:6px 8px;font-size:12px;outline:none">
    <option value="0">Off</option>
    <option value="30" selected>30s</option>
    <option value="60">1m</option>
    <option value="300">5m</option>
  </select>
</div>

<!-- Stats -->
<div class="stats" id="stats">
  <div class="stat-card"><div class="stat-label">Total Incidents</div><div class="stat-value total" id="s-total">—</div></div>
  <div class="stat-card"><div class="stat-label">Critical (P1)</div><div class="stat-value critical" id="s-p1">—</div></div>
  <div class="stat-card"><div class="stat-label">High (P2)</div><div class="stat-value high" id="s-p2">—</div></div>
  <div class="stat-card"><div class="stat-label">Avg Confidence</div><div class="stat-value resolved" id="s-conf">—</div></div>
</div>

<!-- Filters -->
<div class="filters">
  <span class="filter-label">Severity:</span>
  <button class="filter-btn active" onclick="setFilter('all',this)">All</button>
  <button class="filter-btn" onclick="setFilter('P1',this)">P1 Critical</button>
  <button class="filter-btn" onclick="setFilter('P2',this)">P2 High</button>
  <button class="filter-btn" onclick="setFilter('P3',this)">P3 Medium</button>
  <button class="filter-btn" onclick="setFilter('P4',this)">P4 Low</button>
  <input class="search-input" type="text" id="searchInput"
    placeholder="🔍 Search alerts..." oninput="renderTable()">
</div>

<!-- Table -->
<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th>Incident ID</th>
        <th>Alert Name</th>
        <th>Severity</th>
        <th>Confidence</th>
        <th>Runbook Used</th>
        <th>Generated At</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <div id="stateBox" class="state-box">
    <div class="spinner"></div>
    <p>Connecting to agent...</p>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalContent"></div>
</div>

<script>
let allIncidents = [];
let currentFilter = 'all';
let autoRefreshTimer = null;
let agentBaseUrl = '';

// ── Derive base URL from history URL
function getBaseUrl(historyUrl) {
  try {
    const u = new URL(historyUrl);
    return `${u.protocol}//${u.host}`;
  } catch { return ''; }
}

// ── Load incidents from agent
async function loadIncidents() {
  const url = document.getElementById('agentUrl').value.trim();
  if (!url) return;
  agentBaseUrl = getBaseUrl(url);

  showState('loading', 'Fetching incidents from agent...');

  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    allIncidents = data.incidents || [];
    updateStats();
    renderTable();
    document.getElementById('lastRefresh').textContent =
      'Updated ' + new Date().toLocaleTimeString();
    document.getElementById('stateBox').style.display = 'none';
  } catch (err) {
    showState('error', `Failed to fetch: ${err.message}<br><small>Check agent URL and ensure CORS is enabled on /agent/history</small>`);
  }
}

// ── Stats
function updateStats() {
  document.getElementById('s-total').textContent = allIncidents.length;
  document.getElementById('s-p1').textContent =
    allIncidents.filter(i => i.severity === 'P1' || i.severity === 'critical').length;
  document.getElementById('s-p2').textContent =
    allIncidents.filter(i => i.severity === 'P2' || i.severity === 'high').length;
  const confs = allIncidents.map(i => i.confidence || 0).filter(c => c > 0);
  document.getElementById('s-conf').textContent =
    confs.length ? Math.round(confs.reduce((a,b)=>a+b,0)/confs.length*100)+'%' : 'N/A';
}

// ── Filter
function setFilter(val, btn) {
  currentFilter = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

// ── Render table
function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allIncidents.filter(i => {
    const matchSev = currentFilter === 'all' ||
      (i.severity || '').toUpperCase() === currentFilter ||
      (i.severity || '').toLowerCase() === currentFilter.toLowerCase();
    const matchSearch = !search ||
      (i.alert_name || '').toLowerCase().includes(search) ||
      (i.incident_id || '').toLowerCase().includes(search) ||
      (i.runbook_used || '').toLowerCase().includes(search);
    return matchSev && matchSearch;
  });

  const tbody = document.getElementById('tableBody');
  if (filtered.length === 0 && allIncidents.length > 0) {
    tbody.innerHTML = '';
    showState('empty', 'No incidents match your filter.');
    return;
  }
  document.getElementById('stateBox').style.display = 'none';

  tbody.innerHTML = filtered.map((inc, idx) => {
    const conf = inc.confidence || 0;
    const confPct = Math.round(conf * 100);
    const confColor = conf >= 0.7 ? 'var(--low)' : conf >= 0.4 ? 'var(--medium)' : 'var(--critical)';
    const sev = (inc.severity || 'unknown').toUpperCase();
    return `
    <tr onclick="toggleExpand(${idx})">
      <td><span class="inc-id">${inc.incident_id || '—'}</span></td>
      <td><strong>${inc.alert_name || '—'}</strong></td>
      <td><span class="badge ${sev}">${sev}</span></td>
      <td>
        <div class="conf-bar">
          <div class="conf-track">
            <div class="conf-fill" style="width:${confPct}%;background:${confColor}"></div>
          </div>
          <span class="conf-text">${confPct}%</span>
        </div>
      </td>
      <td style="color:var(--text-muted);font-size:12px">${inc.runbook_used || 'none'}</td>
      <td style="color:var(--text-muted);font-size:12px">${inc.generated_at || '—'}</td>
      <td style="color:var(--accent)">▸</td>
    </tr>
    <tr class="expand-row" id="expand-${idx}">
      <td colspan="7">
        <div class="expand-content" id="expand-content-${idx}">
          <div class="expand-grid">
            <div class="expand-section">
              <h4>Incident Details</h4>
              <p><strong>ID:</strong> ${inc.incident_id || '—'}</p>
              <p><strong>Alert:</strong> ${inc.alert_name || '—'}</p>
              <p><strong>Severity:</strong> ${sev}</p>
              <p><strong>Confidence:</strong> ${confPct}%</p>
              <p><strong>Runbook:</strong> ${inc.runbook_used || 'none'}</p>
              <p><strong>Generated:</strong> ${inc.generated_at || '—'}</p>
            </div>
            <div class="expand-section">
              <h4>RCA / Diagnosis</h4>
              <div class="rca-box" id="rca-${idx}">
                ${inc.rca || inc.diagnosis || inc.response ||
                  '<span style="color:var(--text-muted)">Loading full RCA...</span>'}
              </div>
            </div>
          </div>
          <div class="expand-actions">
            <button class="btn btn-ghost" onclick="openModal(${idx});event.stopPropagation()">
              ⤢ Full View
            </button>
            <button class="btn btn-ghost" onclick="fetchFullRCA('${inc.incident_id}',${idx});event.stopPropagation()">
              ↻ Load RCA
            </button>
            <button class="btn btn-ghost" onclick="copyIncident(${idx});event.stopPropagation()">
              ⎘ Copy JSON
            </button>
            <button class="btn btn-ghost" onclick="downloadSingleJSON(${idx});event.stopPropagation()">
              ⬇ JSON
            </button>
            <button class="btn btn-ghost" onclick="downloadSingleHTML(${idx});event.stopPropagation()">
              ⬇ HTML Report
            </button>
          </div>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── Toggle expand row
function toggleExpand(idx) {
  const content = document.getElementById(`expand-content-${idx}`);
  const isOpen = content.classList.contains('open');
  document.querySelectorAll('.expand-content').forEach(el => el.classList.remove('open'));
  if (!isOpen) content.classList.add('open');
}

// ── Fetch full RCA from agent
async function fetchFullRCA(incidentId, idx) {
  if (!incidentId || !agentBaseUrl) return;
  const rcaBox = document.getElementById(`rca-${idx}`);
  rcaBox.textContent = 'Loading...';
  try {
    // Try JSON endpoint first
    const res = await fetch(`${agentBaseUrl}/agent/rca/${incidentId}`);
    if (res.ok) {
      const data = await res.json();
      rcaBox.textContent = data.rca || data.diagnosis || data.response ||
        JSON.stringify(data, null, 2);
      allIncidents[idx] = {...allIncidents[idx], rca: rcaBox.textContent};
    } else {
      rcaBox.textContent = `RCA endpoint returned ${res.status}`;
    }
  } catch (err) {
    rcaBox.textContent = `Could not load RCA: ${err.message}`;
  }
}

// ── Full detail modal
function openModal(idx) {
  const inc = allIncidents.filter(i => {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const matchSev = currentFilter === 'all' ||
      (i.severity || '').toUpperCase() === currentFilter;
    const matchSearch = !search ||
      (i.alert_name || '').toLowerCase().includes(search) ||
      (i.incident_id || '').toLowerCase().includes(search);
    return matchSev && matchSearch;
  })[idx];
  if (!inc) return;

  const sev = (inc.severity || 'unknown').toUpperCase();
  const conf = Math.round((inc.confidence || 0) * 100);
  document.getElementById('modalContent').innerHTML = `

        <div><span style="color:var(--text-muted)">Generated:</span> ${inc.generated_at || '—'}</div>
        <div><span style="color:var(--text-muted)">Runbook:</span> ${inc.runbook_used || 'none'}</div>

}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

// ── Copy JSON
function copyIncident(idx) {
  const filtered = allIncidents.filter(i => {
    const search = document.getElementById('searchInput').value.toLowerCase();
    const matchSev = currentFilter === 'all' || (i.severity||'').toUpperCase() === currentFilter;
    const matchSearch = !search || (i.alert_name||'').toLowerCase().includes(search) || (i.incident_id||'').toLowerCase().includes(search);
    return matchSev && matchSearch;
  });
  navigator.clipboard.writeText(JSON.stringify(filtered[idx], null, 2))
    .then(() => alert('Copied to clipboard'))
    .catch(() => alert('Copy failed'));
}

// ── State helpers
function showState(type, msg) {
  const box = document.getElementById('stateBox');
  box.style.display = 'block';
  if (type === 'loading') {
    box.innerHTML = `<div class="spinner"></div><p>${msg}</p>`;
  } else if (type === 'error') {
    box.innerHTML = `<div class="icon">⚠️</div><p style="color:var(--critical)">${msg}</p>`;
  } else {
    box.innerHTML = `<div class="icon">📭</div><p>${msg}</p>`;
  }
}

// ── Auto refresh
function setAutoRefresh() {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  const secs = parseInt(document.getElementById('refreshInterval').value);
  if (secs > 0) {
    autoRefreshTimer = setInterval(loadIncidents, secs * 1000);
  }
}

// ── Keyboard shortcut: Escape closes modal/menu
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeModal(); closeDownloadMenu(); }
});

// Close download menu when clicking outside
document.addEventListener('click', e => {
  const menu = document.getElementById('dlMenu');
  const btn  = document.getElementById('dlBtn');
  if (menu && !menu.contains(e.target) && e.target !== btn) {
    menu.style.display = 'none';
  }
});

// ── Download menu toggle
function toggleDownloadMenu() {
  const menu = document.getElementById('dlMenu');
  menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}
function closeDownloadMenu() {
  const menu = document.getElementById('dlMenu');
  if (menu) menu.style.display = 'none';
}

// ── Helper: trigger browser file download
function triggerDownload(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Helper: get filtered incidents
function getFiltered() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  return allIncidents.filter(i => {
    const matchSev = currentFilter === 'all' ||
      (i.severity || '').toUpperCase() === currentFilter;
    const matchSearch = !search ||
      (i.alert_name || '').toLowerCase().includes(search) ||
      (i.incident_id || '').toLowerCase().includes(search);
    return matchSev && matchSearch;
  });
}

// ── Helper: incidents → CSV string
function toCSV(incidents) {
  const headers = ['incident_id','alert_name','severity','confidence','runbook_used','generated_at','html_url'];
  const rows = incidents.map(i =>
    headers.map(h => {
      const val = String(i[h] ?? '');
      return val.includes(',') || val.includes('"') || val.includes('\n')
        ? `"${val.replace(/"/g, '""')}"` : val;
    }).join(',')
  );
  return [headers.join(','), ...rows].join('\n');
}

// ── Download ALL incidents as JSON
function downloadJSON() {
  if (!allIncidents.length) { alert('No incidents loaded yet.'); return; }
  const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  triggerDownload(
    `sre-incidents-all-${ts}.json`,
    JSON.stringify({ total: allIncidents.length, exported_at: new Date().toISOString(), incidents: allIncidents }, null, 2),
    'application/json'
  );
}

// ── Download ALL incidents as CSV
function downloadCSV() {
  if (!allIncidents.length) { alert('No incidents loaded yet.'); return; }
  const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  triggerDownload(`sre-incidents-all-${ts}.csv`, toCSV(allIncidents), 'text/csv');
}

// ── Download FILTERED incidents as JSON
function downloadFilteredJSON() {
  const filtered = getFiltered();
  if (!filtered.length) { alert('No incidents match current filter.'); return; }
  const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  triggerDownload(
    `sre-incidents-filtered-${ts}.json`,
    JSON.stringify({ total: filtered.length, filter: currentFilter, exported_at: new Date().toISOString(), incidents: filtered }, null, 2),
    'application/json'
  );
}

// ── Download FILTERED incidents as CSV
function downloadFilteredCSV() {
  const filtered = getFiltered();
  if (!filtered.length) { alert('No incidents match current filter.'); return; }
  const ts = new Date().toISOString().slice(0,19).replace(/[T:]/g,'-');
  triggerDownload(`sre-incidents-filtered-${ts}.csv`, toCSV(filtered), 'text/csv');

// ── Download single incident as JSON
function downloadSingleJSON(idx) {
  const filtered = getFiltered();
  const inc = filtered[idx];
  if (!inc) return;
  triggerDownload(
    `${inc.incident_id}.json`,
    JSON.stringify(inc, null, 2),
    'application/json'
  );
}
