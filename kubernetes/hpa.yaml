apiVersion: autoscaling/v2 
kind: HorizontalPodAutoscaler
metadata:
  name: sre-ai-agent
  namespace: sre-ai-agent
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sre-ai-agent
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70