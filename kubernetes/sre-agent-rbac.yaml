apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-agent-log-reader
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-agent-log-reader
subjects:
- kind: ServiceAccount
  name: default
  namespace: sre-ai-agent-llm
roleRef:
  kind: ClusterRole
  name: sre-agent-log-reader
  apiGroup: rbac.authorization.k8s.io
